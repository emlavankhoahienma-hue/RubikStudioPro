name: RubikStudioPro
options:
  bundleIdPrefix: com.rubikstudio
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    SWIFT_OBJC_INTEROP_MODE: "objcxx"
    GCC_C_LANGUAGE_STANDARD: "gnu17"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  RubikStudioPro:
    type: application
    platform: iOS
    sources:
      - path: CoreCpp
        headerVisibility: public
      - path: SwiftApp
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: "SwiftApp/Bridge/RubikStudioPro-Bridging-Header.h"
        INFOPLIST_GENERATION_MODE: GeneratedFile
        INFOPLIST_KEY_NSCameraUsageDescription: "Quét 6 mặt khối Rubik để nhận diện màu sắc và giải tự động"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: com.rubikstudio.pro
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
